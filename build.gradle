plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'dev.ronpresence'
version = '1.0.0'
base.archivesName = 'ron-discord-presence'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs {
        client {
            workingDirectory project.file('run')
            mods { ron_discord_presence { source sourceSets.main } }
        }
    }
}

repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test {
    useJUnitPlatform()
    if (project.hasProperty('ronReleaseJar')) {
        systemProperty 'ronReleaseJar', file(project.property('ronReleaseJar')).absolutePath
    }
}
jar {
    archiveClassifier = 'mc1.20.1-ron1.4.4f'
    manifest.attributes('Implementation-Version': project.version, 'MixinConfigs': 'ron_discord_presence.mixins.json')
    finalizedBy 'reobfJar'
}
